<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIXIMA | Economic Intelligence</title>
<meta name="description" content="TRIXIMA turns economic, commodity and cost data into clear procurement decisions. Coming soon.">
<meta name="theme-color" content="#502E7B">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="TRIXIMA | Economic Intelligence">
<meta property="og:description" content="Complex data. Clear decisions. Coming soon.">
<meta property="og:url" content="https://trixima.com/">
<style>
  :root{--purple:#502E7B;--orange:#F28C18;--teal:#19B0A4;--ink:#211A2E;--slate:#5A5775;--mist:#F5F4F8}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--mist);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
  .logo{width:min(520px,88vw);height:auto}
  .bar{display:flex;gap:6px;margin:40px 0 28px}
  .bar span{width:36px;height:4px;border-radius:2px}
  p.lead{font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.55;color:var(--slate);max-width:34em}
  p.soon{margin-top:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--purple)}
  a.mail{display:inline-block;margin-top:36px;padding:12px 26px;border-radius:999px;background:var(--purple);color:#fff;text-decoration:none;font-weight:600;font-size:1rem}
  a.mail:hover{background:#3f2463}
  footer{text-align:center;padding:20px;font-size:.8rem;color:var(--slate)}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.svg" alt="TRIXIMA — Complex data. Clear decisions.">
  <div class="bar" aria-hidden="true"><span style="background:var(--purple)"></span><span style="background:var(--orange)"></span><span style="background:var(--teal)"></span></div>
  <p class="lead">Economic intelligence for procurement and cost decisions in manufacturing.</p>
  <p class="soon">Coming soon</p>
  <a class="mail" href="mailto:info@trixima.com">info@trixima.com</a>
</main>
<footer>&copy; 2026 TRIXIMA</footer>
</body>
</html>
